    url: jdbc:postgresql://localhost:5432/computer_association
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  # 自动执行SQL脚本配置
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/*.sql
  # 邮件配置
  mail:
