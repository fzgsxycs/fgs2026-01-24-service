# 数据库配置
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 
    driver-class-name: org.postgresql.Driver
  # 自动执行SQL脚本配置
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/*.sql
  # 邮件配置
  mail:
    host: smtp.163.com
    port: 465
    username: 18065143863@163.com
    password: ZCkcZ3GDA8JqZvvP
    from: 18065143863@163.com
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  # 环境配置
  profiles:
    active: prod

# 服务器配置
server:
  port: 9100
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.computerassociation.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT配置
jwt:
  secret: computer_association_secret_key  # JWT密钥，生产环境中应更安全
  expiration: 86400  # JWT过期时间（秒），默认为24小时

# 日志配置
logging:
  level:
    com.example.computerassociation: DEBUG
    org.springframework.mail: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"