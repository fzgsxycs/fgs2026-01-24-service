# 数据库配置
spring:
  profiles:
    include: liquibase
  datasource:
    url: jdbc:postgresql://localhost:5432/computer_association
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  # 自动执行SQL脚本配置（已禁用，使用Liquibase）
  sql:
    init:
      mode: never
 # 邮件配置
  mail:
